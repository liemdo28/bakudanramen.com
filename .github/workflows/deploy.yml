name: Deploy bakudanramen.com

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Stage deploy files
        run: |
          mkdir -p /tmp/deploy
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='test-results' \
            --exclude='data' \
            --exclude='uploads' \
            --exclude='server' \
            --exclude='qa' \
            --exclude='/stories' \
            --exclude='Walkthrough' \
            --exclude='*.md' \
            --exclude='package*.json' \
            --exclude='playwright.config*' \
            --exclude='*.sh' \
            --exclude='.htpasswd' \
            --exclude='.env*' \
            --include='links-admin/' \
            --include='links-admin/**' \
            ./ /tmp/deploy/

      - name: Deploy via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.PORT || '22' }}
          source: "/tmp/deploy/"
          target: "${{ secrets.TARGET_DIR || '/bakudanramen.com' }}"
          strip_components: 1
          overwrite: true
